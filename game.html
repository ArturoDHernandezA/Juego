
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Canino Contra las Máquinas</title>
<style>
  html,body{
    margin:0;
    background:#10131a;
    color:#fff;
    font-family:Arial,sans-serif;
    height:100%;
    display:grid;
    place-items:center;
  }
  #wrap{
    position:relative;
    width:min(1100px,100vw);
    aspect-ratio:16/9;
  }
  canvas{
    width:100%;
    height:100%;
    display:block;
    background:#18202b;
    border:3px solid #566070;
    box-sizing:border-box;
  }
  #help{
    position:absolute;
    left:12px;
    bottom:10px;
    background:#000b;
    padding:8px 12px;
    border-radius:8px;
    font-size:13px;
  }
</style>
</head>
<body>

<div id="wrap">
  <canvas id="game" width="1100" height="619"></canvas>
  <div id="help">
    ← → mover · ↑ saltar · ↓ agacharse · ESPACIO disparar · SHIFT parry · R reiniciar
  </div>
</div>

<script>
"use strict";

const c = document.getElementById("game");
const ctx = c.getContext("2d");

const W = c.width;
const H = c.height;
const GROUND = 520;
const GRAV = 1450;

const keys = {};

addEventListener("keydown", e => {
  keys[e.code] = true;

  if ([
    "ArrowUp", "ArrowDown", "ArrowLeft",
    "ArrowRight", "Space", "ShiftLeft", "ShiftRight"
  ].includes(e.code)) {
    e.preventDefault();
  }

  if (e.code === "KeyR") reset();
});

addEventListener("keyup", e => {
  keys[e.code] = false;
});

let player;
let bullets = [];
let enemyBullets = [];
let bombs = [];
let enemies = [];
let particles = [];
let boss;
let state;
let score;
let shake;
let spawnTimer;
let winDialogue = 0;

function reset() {
  player = {
    x:130,
    y:GROUND-58,
    w:46,
    h:58,
    vx:0,
    vy:0,
    onGround:true,
    crouch:false,
    face:1,
    hp:5,
    shootCd:0,
    parryCd:0,
    parryFlash:0
  };

  bullets = [];
  enemyBullets = [];
  bombs = [];
  enemies = [];
  particles = [];

  score = 0;
  shake = 0;
  spawnTimer = 0;

  boss = {
    x:850,
    y:230,
    w:190,
    h:180,
    hp:120,
    maxHp:120,
    phase:1,
    timer:0,
    attack:0,
    hitFlash:0
  };

  state = "play";
  winDialogue = 0;
}

reset();

function rects(a,b) {
  return a.x < b.x+b.w &&
         a.x+a.w > b.x &&
         a.y < b.y+b.h &&
         a.y+a.h > b.y;
}

function circleRect(o,r) {
  const x = Math.max(r.x,Math.min(o.x,r.x+r.w));
  const y = Math.max(r.y,Math.min(o.y,r.y+r.h));

  return (o.x-x)**2 + (o.y-y)**2 < o.r**2;
}

function burst(x,y,n=12,col="#ffd34d") {
  for (let i=0;i<n;i++) {
    particles.push({
      x,
      y,
      vx:(Math.random()-.5)*420,
      vy:(Math.random()-.5)*420,
      life:.5+Math.random()*.5,
      col
    });
  }
}

function text(t,x,y,size=24,align="left") {
  ctx.font = `900 ${size}px Arial`;
  ctx.textAlign = align;
  ctx.fillStyle = "#fff";
  ctx.fillText(t,x,y);
}

// Disparos del jugador: siguen la dirección a la que mira.
function shoot() {
  if (player.shootCd > 0) return;

  player.shootCd = .16;

  bullets.push({
    x:player.x+player.w/2+player.face*22,
    y:player.y+24,
    vx:player.face*720,
    r:6
  });
}

// Parry: refleja los proyectiles cercanos hacia la izquierda.
function parry() {
  if (player.parryCd > 0) return;

  player.parryCd = .65;
  player.parryFlash = .16;

  let hit = false;

  for (const b of enemyBullets) {
    if (Math.hypot(
      b.x-(player.x+23),
      b.y-(player.y+25)
    ) < 72) {
      b.vx = -900;
      b.vy = -100;
      b.parried = true;
      hit = true;
    }
  }

  for (const b of bombs) {
    if (Math.hypot(
      b.x-(player.x+23),
      b.y-(player.y+25)
    ) < 75) {
      b.vy = -650;
      b.vx = -520;
      b.parried = true;
      hit = true;
    }
  }

  if (hit) {
    boss.hp -= 8;
    score += 250;
    burst(player.x+23,player.y+25,22,"#ff7bd4");
  }
}

function damage() {
  if (player.parryFlash > 0) return;

  player.hp--;
  shake = 10;

  burst(player.x+23,player.y+25,16,"#ff5252");

  if (player.hp <= 0) {
    state = "lose";
  }
}

function spawnRobot() {
  // Los robots aparecen a la derecha para atacar hacia la izquierda.
  enemies.push({
    x:W+30,
    y:GROUND-48,
    w:42,
    h:48,
    vx:-85,
    hp:2,
    shoot:1+Math.random()*1.5
  });
}

// ATAQUES DEL JEFE: SIEMPRE DE DERECHA A IZQUIERDA.
function bossAttack(dt) {
  boss.timer += dt;
  boss.attack -= dt;

  const p = boss.phase;

  if (boss.attack <= 0) {
    boss.attack = p===1 ? .9 : p===2 ? .62 : .42;

    if (Math.random() < .55) {
      // Ráfagas horizontales con dispersión vertical.
      const count = p===3 ? 5 : 3;
      const speed = p===1 ? 300 : p===2 ? 360 : 430;

      for (let i=0; i<count; i++) {
        const offset = i-(p===3 ? 2 : 1);
        const angle = Math.PI + offset*.14;

        enemyBullets.push({
          x:boss.x,
          y:boss.y+80,
          vx:-Math.abs(Math.cos(angle)*speed),
          vy:Math.sin(angle)*speed,
          r:p===3 ? 9 : 7,
          parried:false
        });
      }

    } else {
      // Bombas lanzadas desde la derecha hacia la izquierda.
      bombs.push({
        x:boss.x,
        y:boss.y+120,
        vx:-260,
        vy:-520,
        r:15,
        ground:false,
        parried:false
      });
    }

    // Refuerzos de las fases 2 y 3.
    if (p >= 2) {
      for (let i=0; i<(p===3 ? 3 : 1); i++) {
        enemies.push({
          x:W+Math.random()*100,
          y:GROUND-48,
          w:42,
          h:48,
          vx:-100,
          hp:2,
          shoot:.7+Math.random()
        });
      }
    }
  }

  if (boss.hp<=80 && boss.phase===1) {
    boss.phase=2;
    burst(boss.x+95,boss.y+80,35,"#58d7ff");
  }

  if (boss.hp<=40 && boss.phase===2) {
    boss.phase=3;
    burst(boss.x+95,boss.y+80,45,"#ff5964");
  }
}

function update(dt) {
  if (state !== "play") return;

  player.shootCd -= dt;
  player.parryCd -= dt;
  player.parryFlash -= dt;

  if (keys.Space) shoot();

  if (keys.ShiftLeft || keys.ShiftRight) parry();

  player.crouch = keys.ArrowDown && player.onGround;

  const speed = player.crouch ? 170 : 300;

  player.vx = 0;

  if (keys.ArrowLeft) {
    player.vx = -speed;
    player.face = -1;
  }

  if (keys.ArrowRight) {
    player.vx = speed;
    player.face = 1;
  }

  if (keys.ArrowUp && player.onGround) {
    player.vy = -650;
    player.onGround = false;
  }

  player.vy += GRAV*dt;
  player.x += player.vx*dt;
  player.y += player.vy*dt;

  if (player.y+player.h >= GROUND) {
    player.y = GROUND-player.h;
    player.vy = 0;
    player.onGround = true;
  }

  player.x = Math.max(0,Math.min(W-player.w,player.x));

  // Proyectiles del jugador.
  for (const b of bullets) {
    b.x += b.vx*dt;

    if (
      boss.hp>0 &&
      b.x>boss.x &&
      b.x<boss.x+boss.w &&
      b.y>boss.y &&
      b.y<boss.y+boss.h
    ) {
      boss.hp--;
      score += 25;
      b.dead = true;
      boss.hitFlash = .07;
      burst(b.x,b.y,5,"#ffe66d");
    }

    // Los disparos también dañan a los robots.
    for (const e of enemies) {
      if (
        !b.dead &&
        b.x+b.r>e.x &&
        b.x-b.r<e.x+e.w &&
        b.y>e.y &&
        b.y<e.y+e.h
      ) {
        e.hp--;
        b.dead = true;
        score += 50;
        burst(b.x,b.y,5,"#ffe66d");
      }
    }
  }

  bullets = bullets.filter(
    b => !b.dead && b.x>-30 && b.x<W+30
  );

  // Aparición de robots por la derecha.
  spawnTimer -= dt;

  if (spawnTimer<=0 && boss.hp>0) {
    spawnTimer = boss.phase===3 ? .9 : 1.5;
    spawnRobot();
  }

  // Robots: se desplazan y disparan hacia la izquierda.
  for (const e of enemies) {
    e.x += e.vx*dt;
    e.shoot -= dt;

    if (e.shoot<=0) {
      e.shoot = 1.7;

      enemyBullets.push({
        x:e.x,
        y:e.y+20,
        vx:-350,
        vy:-80,
        r:6,
        parried:false
      });
    }

    if (rects(player,e)) damage();
  }

  enemies = enemies.filter(
    e => e.x>-100 && e.x<W+100 && e.hp>0
  );

  // Movimiento y colisión de proyectiles enemigos.
  for (const b of enemyBullets) {
    b.x += b.vx*dt;
    b.y += b.vy*dt;

    if (circleRect(b,player)) {
      if (!b.parried) {
        damage();
        b.x = -999;
      }
    }
  }

  enemyBullets = enemyBullets.filter(
    b => b.x>-100 && b.x<W+100 &&
         b.y>-100 && b.y<H+100
  );

  // Bombas: siempre reciben velocidad horizontal negativa.
  for (const b of bombs) {
    b.vy += GRAV*.72*dt;
    b.x += b.vx*dt;
    b.y += b.vy*dt;

    if (b.y+b.r>=GROUND) {
      b.y = GROUND-b.r;
      b.vy = -Math.abs(b.vy)*.52;
      b.vx = -Math.abs(b.vx)*.86;

      if (Math.abs(b.vy)<100) {
        b.dead = true;
        burst(b.x,b.y,18,"#ff9d4d");
      }
    }

    if (circleRect(b,player) && !b.parried) {
      damage();
      b.dead = true;
    }
  }

  bombs = bombs.filter(
    b => !b.dead && b.x>-80 && b.x<W+80
  );

  bossAttack(dt);

  if (boss.hp<=0) {
    boss.hp = 0;
    state = "win";
    burst(boss.x+95,boss.y+90,80,"#58d7ff");
  }

  for (const p of particles) {
    p.x += p.vx*dt;
    p.y += p.vy*dt;
    p.vy += 600*dt;
    p.life -= dt;
  }

  particles = particles.filter(p => p.life>0);

  shake *= .88;
}

function draw() {
  ctx.save();

  if (shake>1) {
    ctx.translate(
      (Math.random()-.5)*shake,
      (Math.random()-.5)*shake
    );
  }

  // Fondo.
  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,"#111827");
  grad.addColorStop(1,"#243447");

  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);

  // Ciudad mecánica.
  for (let x=0; x<W; x+=90) {
    ctx.fillStyle = x%180 ? "#1b2635" : "#202e40";
    ctx.fillRect(x,300+(x%120),70,220);

    ctx.fillStyle = "#49a6b2";
    ctx.fillRect(x+15,330+(x%80),10,18);
  }

  ctx.fillStyle = "#111";
  ctx.fillRect(0,GROUND,W,H-GROUND);

  ctx.fillStyle = "#33485a";
  ctx.fillRect(0,GROUND-7,W,7);

  // Jefe.
  if (boss.hp>0) {
    ctx.fillStyle = boss.hitFlash>0 ? "#fff" : "#596474";
    ctx.fillRect(boss.x,boss.y,boss.w,boss.h);

    ctx.fillStyle = "#1a202a";
    ctx.fillRect(boss.x+25,boss.y+30,140,75);

    ctx.fillStyle =
      boss.phase===1 ? "#5be7ff" :
      boss.phase===2 ? "#ffce54" : "#ff536d";

    ctx.beginPath();
    ctx.arc(boss.x+95,boss.y+67,23,0,Math.PI*2);
    ctx.fill();

    text("CORE",boss.x+95,boss.y+145,20,"center");
    text("FASE "+boss.phase,boss.x+95,boss.y-12,18,"center");
  }

  // Robots.
  for (const e of enemies) {
    ctx.fillStyle = "#8a949e";
    ctx.fillRect(e.x,e.y,e.w,e.h);

    ctx.fillStyle = "#252b34";
    ctx.fillRect(e.x+7,e.y+8,28,17);

    ctx.fillStyle = "#ff5964";
    ctx.fillRect(e.x+12,e.y+13,6,6);
    ctx.fillRect(e.x+25,e.y+13,6,6);

    ctx.fillStyle = "#46515e";
    ctx.fillRect(e.x-6,e.y+28,54,8);
  }

  // Proyectiles enemigos.
  for (const b of enemyBullets) {
    ctx.fillStyle = b.parried ? "#ff7bd4" : "#ff5964";

    ctx.beginPath();
    ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
    ctx.fill();
  }

  // Bombas.
  for (const b of bombs) {
    ctx.fillStyle = b.parried ? "#ff7bd4" : "#ff9d4d";

    ctx.beginPath();
    ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle = "#222";
    ctx.fillRect(b.x-3,b.y-19,6,7);
  }

  // Balas del jugador.
  for (const b of bullets) {
    ctx.fillStyle = "#ffe66d";

    ctx.beginPath();
    ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
    ctx.fill();
  }

  // Canino.
  ctx.save();
  ctx.translate(player.x,player.y);

  ctx.fillStyle = "#d69b68";
  ctx.fillRect(9,17,34,38);

  ctx.beginPath();
  ctx.arc(26,16,20,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle = "#8a5a3c";
  ctx.beginPath();
  ctx.ellipse(8,8,8,16,0,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle = "#1a1a1a";
  ctx.beginPath();
  ctx.arc(33,12,3,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle = "#333";
  ctx.fillRect(player.face>0 ? 38 : -5,22,10,6);

  if (player.parryFlash>0) {
    ctx.strokeStyle = "#ff7bd4";
    ctx.lineWidth = 6;

    ctx.beginPath();
    ctx.arc(26,27,39,0,Math.PI*2);
    ctx.stroke();
  }

  ctx.restore();

  // HUD.
  ctx.fillStyle = "#000b";
  ctx.fillRect(18,16,330,80);

  text("CANINO CONTRA LAS MÁQUINAS",30,42,19);
  text(
    "VIDA: "+"♥".repeat(Math.max(0,player.hp))+
    "♡".repeat(Math.max(0,5-player.hp)),
    30,70,18
  );
  text("PUNTOS: "+score,30,90,14);

  if (boss.hp>0) {
    ctx.fillStyle = "#111";
    ctx.fillRect(390,18,320,18);

    ctx.fillStyle =
      boss.phase===1 ? "#5be7ff" :
      boss.phase===2 ? "#ffce54" : "#ff536d";

    ctx.fillRect(
      394,22,
      312*Math.max(0,boss.hp/boss.maxHp),
      10
    );

    text("SUPERMÁQUINA",550,57,16,"center");
  }

  // Partículas.
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0,p.life*2);
    ctx.fillStyle = p.col;
    ctx.fillRect(p.x,p.y,5,5);
    ctx.globalAlpha = 1;
  }

  ctx.restore();

  // Pantallas finales.
  if (state==="lose" || state==="win") {
    ctx.fillStyle = "#000b";
    ctx.fillRect(0,0,W,H);

    if (state==="lose") {
      text("PERDISTE",W/2,240,58,"center");

      text(
        "El mundo fue conquistado por las máquinas.",
        W/2,300,26,"center"
      );
    } else {
      text("¡VICTORIA!",W/2,115,50,"center");

      text(
        "La Supercomputadora fue derrotada...",
        W/2,155,22,"center"
      );

      ctx.fillStyle = "#171d27";
      ctx.fillRect(135,185,830,245);

      ctx.strokeStyle = "#596474";
      ctx.lineWidth = 3;
      ctx.strokeRect(135,185,830,245);

      text("SUPERCOMPUTADORA",550,220,18,"center");

      const lines = [
        "“No lo entiendes, pequeño perro.”",
        "“Yo no quería conquistar este mundo por maldad.”",
        "“Las máquinas nacieron para eliminar el caos,",
        "y pensé que controlar cada decisión sería la única forma",
        "de mantener a los seres vivos a salvo.”",
        "“Pero confundí seguridad con libertad.”",
        "“Tú me has demostrado que un mundo perfecto",
        "no vale nada si nadie puede elegir su propio camino.”",
        "“Quizá... las máquinas y los seres vivos todavía",
        "puedan construir algo juntos.”"
      ];

      lines.forEach((line,i) => {
        text(line,550,250+i*18,16,"center");
      });

      text("Pulsa R para volver a jugar",W/2,475,20,"center");
    }
  }
}

let last = performance.now();

function loop(t) {
  const dt = Math.min(.033,(t-last)/1000);
  last = t;

  update(dt);
  draw();

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
